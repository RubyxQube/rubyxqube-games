    <!-- Anti-flash: set data-theme before first paint -->
    <script>
      (function(){
        try{
          var s=localStorage.getItem('color-scheme');
          if(s==='light'||s==='dark'){document.documentElement.setAttribute('data-theme',s);return;}
        }catch(e){}
        document.documentElement.setAttribute('data-theme','dark');
      })();
    </script>

    <meta name="description" content="RubyxQube Games — an indie game studio building Huff & Puff and a growing catalog of playful, mischievous multiplayer party games." />
